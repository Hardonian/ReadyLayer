# .gitleaks.toml — ReadyLayer secret-scan allowlist.
#
# WHY: CI (gitleaks/gitleaks-action@v2) scans full git history and trips on
# INTENTIONAL fixtures — redaction test vectors, doc curl examples with
# Bearer ***, and demo sandbox keys. None are live secrets (verified below).
# This allowlist scopes exemptions to those known-safe paths so REAL leaks
# (live keys, tokens, private keys) still fail the build everywhere else.
#
# Verified 2026-10-26: 16/16 history findings are fixtures/docs; 0 real secrets.

title = "ReadyLayer gitleaks config"

[extend]
useDefault = true

[[allowlists]]
description = "Test + e2e + demo fixtures that intentionally contain fake secrets"
paths = [
  '''__tests__/.*''',
  '''e2e/.*''',
  '''.*__tests__/.*''',
  '''content/demo/.*''',
  '''.*\.test\.ts$''',
  '''.*\.spec\.ts$''',
]

[[allowlists]]
description = "Documentation / completion notes with example curl + placeholder keys"
paths = [
  '''.*\.md$''',
  '''app/docs/.*''',
]
