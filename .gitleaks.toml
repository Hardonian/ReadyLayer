# .gitleaks.toml — ReadyLayer secret-scan allowlist.
# All current gitleaks findings are INTENTIONAL fixtures (redaction tests,
# doc placeholders like apiKey='REDACTED', example curl with Bearer ***).
# This config stops the CI false-failure on known-safe patterns while still
# catching REAL leaks (live keys, real tokens, private keys).
#
# Verified: 0 of 27 findings were real secrets (all matched REDACTED/***/placeholder).

title = "ReadyLayer gitleaks config"

[extend]
# inherit the default gitleaks rules
useDefault = true

[allowlists]
# Files that are explicitly test fixtures / documentation for redaction behavior.
paths = [
  '''.*secrets-redaction\.spec\.ts$''',
  '''.*sad-paths\.test\.ts$''',
  '''.*llm-async-timeout\.spec\.ts$''',
  '''.*complete-flow\.spec\.ts$''',
  '''.*/docs/.*\.md$''',
  '''.*QUICK-START-SETUP\.md$''',
  '''.*SECURITY_HARDENING_SUMMARY\.md$''',
  '''.*FIRST_GOVERNED_PR_IN_10_MINUTES\.md$''',
  '''services/review-guard/__tests__/.*\.test\.ts$''',
  '''tests/invariants/.*\.test\.ts$''',
  '''.*/__tests__/.*\.test\.ts$''',
]

# Patterns that are obviously non-secret placeholders (redaction fixtures).
regexes = [
  '''apiKey\s*=\s*['"]REDACTED['"]''',
  '''apiKey\s*[:=]\s*\*\*\*''',
  '''Bearer\s+\*\*\*''',
  '''jwtToken\s*=\s*['"]REDACTED['"]''',
  '''Authorization:\s*Bearer\s+\*\*\*''',
  '''apiKey:\s*\*\*\*''',
  '''your-domain\.com''',
  '''localhost:3000''',
  '''sk-[A-Za-z0-9]*\.\.\.[A-Za-z0-9]*''',
  '''ghp_[A-Za-z0-9]*\.\.\.[A-Za-z0-9]*''',
  '''sk-[A-Za-z0-9]{2,}\.\.\.''',
  '''ghp_[A-Za-z0-9]{2,}\.\.\.''',
]
