name: Quality Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - uses: pnpm/action-setup@v2
        with:
          version: 8

      - uses: actions/setup-node@v3
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type Check
        run: pnpm type-check

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Security Scan
        run: |
          # Simple check for exposed secrets in codebase
          ! grep -r "STRIPE_SECRET_KEY=" . 
          ! grep -r "SUPABASE_SERVICE_ROLE_KEY=" .
          echo "No hardcoded secrets found."
