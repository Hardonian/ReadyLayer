name: security-gates

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'
  # Manual full-history scan entry point (same path the Monday schedule takes);
  # used to verify gitleaks engine/allowlist changes on main without waiting
  # for the next scheduled run.
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks needs parent commits for <sha>^.. ranges
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Deterministic engine version. Regression evidence (2026-11-09
          # schedule run 42639308112): gitleaks 8.24.3 ignores the repo's
          # .gitleaks.toml allowlist on full-history scans and flags 49
          # already-verified fake fixtures (0 real secrets; see config header).
          # 8.30.1 applies the allowlist correctly (0/959 commits) while still
          # detecting planted live-shaped secrets (canary: 2 rule findings).
          # Bump deliberately, re-run the canary after any change.
          GITLEAKS_VERSION: 8.30.1

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run OSV scanner
        uses: google/osv-scanner-action/osv-scanner-action@8deb546fdb875b9996d27d4950be7312dac076a1 # v2.5.0
        with:
          scan-args: >-
            --lockfile=package-lock.json
            --recursive

  codeql:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
      - name: Analyze
        uses: github/codeql-action/analyze@v3
