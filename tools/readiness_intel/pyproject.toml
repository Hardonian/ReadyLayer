[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "readiness-intel"
version = "1.0.0"
description = "Predictive Code Risk & Change Intelligence System for ReadyLayer"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [
    { name = "ReadyLayer Team", email = "team@readylayer.ai" }
]
keywords = ["readiness", "risk", "prediction", "ci", "intelligence"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "pydantic>=2.0",
    "click>=8.0",
    "rich>=13.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.3.0",
    "python-dateutil>=2.8.0",
    "gitpython>=3.1.0",
    "pyyaml>=6.0",
    "networkx>=3.0",
    "scipy>=1.11.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "ruff>=0.1.0",
    "mypy>=1.0",
    "pytest-asyncio>=0.21.0",
]

[project.scripts]
readiness-intel = "readiness_intel.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/readiness_intel"]

[tool.black]
line-length = 100
target-version = ['py310']

[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "I", "N", "W", "UP", "B", "C4"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
