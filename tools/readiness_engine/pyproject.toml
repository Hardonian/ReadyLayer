[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "readiness-engine"
version = "1.0.0"
description = "AI Code Readiness Aggregator - Judges codebase production-readiness using evidence and invariants"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "click>=8.0",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "mypy>=1.0",
    "ruff>=0.1.0",
]

[project.scripts]
readiness-engine = "readiness_engine.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/readiness_engine"]

[tool.black]
line-length = 100
target-version = ['py310']

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_ignores = true

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "W", "C90"]
ignore = ["E501"]
